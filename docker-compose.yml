services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jokma
      POSTGRES_PASSWORD: jokma
      POSTGRES_DB: jokma
    ports:
      - "5432:5432"
    volumes:
      - jokma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jokma -d jokma"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://jokma:jokma@postgres:5432/jokma
      ROUTER_SECRET_KEY: ${ROUTER_SECRET_KEY:?set ROUTER_SECRET_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  jokma_pg: {}
